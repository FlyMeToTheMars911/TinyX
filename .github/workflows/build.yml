name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Check JavaScript
        run: node --check src/TinyX/Assets/content.js
      - name: Content mode regression checks
        run: node --test tests/content-mode.test.cjs
      - name: Publish portable Windows package
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: TinyX-win-x64
          path: dist/*.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: TinyX-win-x64
          path: package
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" package/*.zip package/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" package/*.zip package/*.sha256 --verify-tag --generate-notes
          fi
